<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>🎁 SURPRISE! ✨</title>
    <!-- Bootstrap 5 + Google Fonts + Anime.js + Canvas Confetti -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1825 50%, #1a1f2e 100%);
            position: relative;
            overflow-x: hidden;
            cursor: default;
        }

        /* Particelle stellari animate in background */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Effetto glow dinamico */
        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(90, 190, 175, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s infinite ease-in-out;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(40px, -30px) scale(1.1); opacity: 0.6; }
        }

        .orb1 { top: -200px; right: -200px; animation-duration: 15s; }
        .orb2 { bottom: -250px; left: -150px; animation-duration: 18s; animation-delay: -5s; }

        /* Card principale effetto vetro + 3D hover */
        .hero-card {
            background: rgba(18, 25, 40, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(90, 190, 175, 0.2);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            padding: 2.5rem 2rem;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .hero-card:hover {
            transform: translateY(-8px) rotateX(2deg);
            box-shadow: 0 45px 65px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(90, 190, 175, 0.4);
        }

        .main-title {
            font-weight: 900;
            font-size: 4.2rem;
            background: linear-gradient(135deg, #E8F7F2, #81D8D0, #5BBFB5, #CFF2EE);
            background-size: 300% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease infinite, titlePulse 2s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titlePulse {
            0% { text-shadow: 0 0 0px rgba(90, 190, 175, 0); }
            100% { text-shadow: 0 0 20px rgba(90, 190, 175, 0.5); }
        }

        .birthday-badge {
            background: rgba(90, 190, 175, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(90, 190, 175, 0.4);
            color: #81D8D0;
            font-weight: 700;
            padding: 0.6rem 1.8rem;
            border-radius: 100px;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: badgeGlow 2s infinite alternate;
        }

        @keyframes badgeGlow {
            0% { box-shadow: 0 0 5px rgba(90, 190, 175, 0.3); border-color: rgba(90, 190, 175, 0.3); }
            100% { box-shadow: 0 0 20px rgba(90, 190, 175, 0.6); border-color: rgba(90, 190, 175, 0.8); }
        }

        /* Bottone spettacolare */
        .btn-wow {
            background: linear-gradient(115deg, #5BBFB5, #3A9E94, #2C7A6E);
            background-size: 200% auto;
            border: none;
            padding: 16px 48px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 80px;
            color: white;
            box-shadow: 0 8px 0 #1A5A4F, 0 0 20px rgba(90, 190, 175, 0.5);
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-wow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-wow:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-wow:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #1A5A4F, 0 0 35px rgba(90, 190, 175, 0.8);
            background-position: right center;
        }

        .btn-wow:active {
            transform: translateY(4px);
            box-shadow: 0 5px 0 #1A5A4F;
        }

        /* Overlay + Card Sorpresa con effetto vetro premium */
        .sorpresa-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1040;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .sorpresa-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .message-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9) rotateX(-15deg);
            width: 90%;
            max-width: 480px;
            background: linear-gradient(135deg, rgba(25, 35, 55, 0.95), rgba(15, 25, 45, 0.98));
            backdrop-filter: blur(20px);
            border-radius: 72px;
            padding: 2.5rem 2rem;
            text-align: center;
            z-index: 1050;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
            border: 1px solid rgba(90, 190, 175, 0.5);
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.5), 0 0 30px rgba(90, 190, 175, 0.3);
        }

        .message-card.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1) rotateX(0deg);
        }

        .message-icon {
            font-size: 4rem;
            animation: iconBounce 0.8s ease infinite alternate;
        }

        @keyframes iconBounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-12px); }
        }

        .message-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #81D8D0, #CFF2EE);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.3;
        }

        /* Biglietto fluttuante con effetto 3D e luce */
        .ticket-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1060;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            pointer-events: none;
        }

        .ticket-wrapper.active {
            visibility: visible;
            pointer-events: auto;
        }

        .floating-ticket {
            max-width: 380px;
            width: 88%;
            background: transparent;
            animation: ticket3DIn 0.7s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
        }

        .floating-ticket:hover {
            transform: scale(1.03) rotate(1deg);
            filter: drop-shadow(0 0 25px rgba(90, 190, 175, 0.6));
        }

        @keyframes ticket3DIn {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(100px) rotate(-8deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.05) translateY(-10px) rotate(2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotate(0deg);
            }
        }

        .ticket-img {
            width: 100%;
            height: auto;
            border-radius: 40px;
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(90, 190, 175, 0.5), 0 0 0 12px rgba(255, 255, 255, 0.1);
            background: #FFF9F0;
            display: block;
            transition: all 0.3s;
        }

        /* Footer elegante */
        .footer-elegant {
            background: rgba(90, 190, 175, 0.15);
            border-radius: 100px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            color: #81D8D0;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 550px) {
            .main-title { font-size: 2.5rem; }
            .message-text { font-size: 1.5rem; }
            .btn-wow { font-size: 1.1rem; padding: 12px 32px; }
        }
    </style>
</head>
<body>

    <!-- Canvas stelle dinamiche -->
    <canvas id="stars-canvas"></canvas>
    
    <!-- Glow orb decorativi -->
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center position-relative" style="z-index: 10;">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-7">
                <div class="hero-card text-center">
                    <div class="mb-3">
                        <span class="birthday-badge">
                            <i class="fas fa-star"></i> 5 Giugno <i class="fas fa-gem"></i>
                        </span>
                    </div>
                    <h1 class="main-title">BUON COMPLEANNO<br>JOANI! 🎂✨</h1>
                    <div class="my-3">
                    </div>
                    <div class="mt-4">
                        <button id="scopriBtn" class="btn btn-wow">
                            <i class="fas fa-gift me-2"></i> SCOPRI LA SORPRESA <i class="fas fa-magic ms-2"></i>
                        </button>
                    </div>
                    <div class="footer-elegant mt-4 d-inline-flex gap-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="globalOverlay" class="sorpresa-overlay"></div>

    <!-- Step 1: Messaggio -->
    <div id="stepOneCard" class="message-card">
        <div class="message-icon">
            <i class="fas fa-calendar-check"></i>
        </div>
        <div class="message-text mt-3">
            Tieniti libera<br>il 4 Luglio sera! 🎤
        </div>
        <p class="mt-3" style="color: #A8D8D0; font-weight: 500;">🎶 Un'esperienza che ti farà saltellare e cantare a squarciagola... 🎶</p>
        <button id="proseguiBtn" class="btn btn-wow w-100 mt-4" style="font-size: 1.1rem; padding: 12px;">
            Prosegui <i class="fas fa-arrow-right ms-2"></i>
        </button>
        <button id="closeStepOneBtn" class="btn btn-outline-light w-100 mt-3" style="border-radius: 60px; background: transparent; border-color: rgba(90,190,175,0.5); color: #81D8D0;">
            Chiudi
        </button>
    </div>

    <!-- Step 2: Biglietto -->
    <div id="ticketWrapper" class="ticket-wrapper">
        <div class="floating-ticket text-center" id="floatingTicketContainer">
            <img id="bigliettoImg" class="ticket-img" src="WhatsApp Image 2026-06-04 at 15.43.22.jpeg" alt="Biglietto Concerto Gemitaiz" style="background: #FFF9F0;">
            <div class="mt-3" style="color: #81D8D0; font-size: 0.85rem; background: rgba(0,0,0,0.5); display: inline-block; padding: 6px 18px; border-radius: 60px; backdrop-filter: blur(8px);">
                <i class="fas fa-hand-peace me-1"></i> Tocca il biglietto per chiudere
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            // STELLE DINAMICHE (Canvas)
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initStars();
            }
            
            function initStars() {
                stars = [];
                const starCount = Math.floor(window.innerWidth * window.innerHeight / 2500);
                for (let i = 0; i < starCount; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2.5,
                        alpha: Math.random() * 0.6 + 0.2,
                        speed: 0.02 + Math.random() * 0.03,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
            
            function drawStars() {
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let star of stars) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 240, 210, ${star.alpha + Math.sin(Date.now() * star.speed + star.phase) * 0.2})`;
                    ctx.fill();
                }
                requestAnimationFrame(drawStars);
            }
            
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            resizeCanvas();
            drawStars();
            
            // CONFETTI AL CLICK DEL BOTTONE PRINCIPALE
            function shootConfetti() {
                canvasConfetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#81D8D0', '#5BBFB5', '#CFF2EE', '#FFD966'] });
                setTimeout(() => {
                    canvasConfetti({ particleCount: 80, spread: 120, origin: { y: 0.5, x: 0.2 }, startVelocity: 20 });
                    canvasConfetti({ particleCount: 80, spread: 120, origin: { y: 0.5, x: 0.8 }, startVelocity: 20 });
                }, 150);
            }
            
            function createSparklesBurst(x, y) {
                for (let i = 0; i < 35; i++) {
                    const spark = document.createElement('div');
                    const icons = ['✨', '⭐', '🎵', '💚', '🎤', '🌟', '💎'];
                    spark.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                    spark.style.position = 'fixed';
                    spark.style.left = x + (Math.random() - 0.5) * 100 + 'px';
                    spark.style.top = y + (Math.random() - 0.5) * 80 + 'px';
                    spark.style.fontSize = (16 + Math.random() * 22) + 'px';
                    spark.style.pointerEvents = 'none';
                    spark.style.zIndex = '2000';
                    spark.style.opacity = '1';
                    spark.style.transition = 'all 1s ease-out';
                    document.body.appendChild(spark);
                    
                    const moveX = (Math.random() - 0.5) * 150;
                    const moveY = -100 - Math.random() * 120;
                    spark.animate([
                        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
                        { transform: `translate(${moveX}px, ${moveY}px) rotate(45deg)`, opacity: 0 }
                    ], { duration: 1000, easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)', fill: 'forwards' });
                    setTimeout(() => spark.remove(), 1050);
                }
            }
            
            // Elementi DOM
            const scopriBtn = document.getElementById('scopriBtn');
            const globalOverlay = document.getElementById('globalOverlay');
            const stepOneCard = document.getElementById('stepOneCard');
            const proseguiBtn = document.getElementById('proseguiBtn');
            const closeStepOneBtn = document.getElementById('closeStepOneBtn');
            const ticketWrapper = document.getElementById('ticketWrapper');
            const floatingTicket = document.getElementById('floatingTicketContainer');
            
            function showStepOne() {
                if (ticketWrapper.classList.contains('active')) hideTicket();
                globalOverlay.classList.add('active');
                stepOneCard.classList.add('active');
                shootConfetti();
                const rect = scopriBtn.getBoundingClientRect();
                createSparklesBurst(rect.left + rect.width/2, rect.top + rect.height/2);
            }
            
            function hideStepOne() {
                globalOverlay.classList.remove('active');
                stepOneCard.classList.remove('active');
            }
            
            function showTicket() {
                hideStepOne();
                ticketWrapper.classList.add('active');
                // Effetto pioggia di stelle
                canvasConfetti({ particleCount: 200, spread: 100, origin: { y: 0.7 }, startVelocity: 15, colors: ['#81D8D0', '#5BBFB5', '#FFD966'] });
                
                const imgElem = document.getElementById('bigliettoImg');
                if (imgElem) {
                    imgElem.onerror = function() {
                        // Biglietto alternativo realistico
                        const canvasAlt = document.createElement('canvas');
                        const ctxAlt = canvasAlt.getContext('2d');
                        canvasAlt.width = 700;
                        canvasAlt.height = 520;
                        ctxAlt.fillStyle = '#FFFCF5';
                        ctxAlt.fillRect(0, 0, canvasAlt.width, canvasAlt.height);
                        ctxAlt.fillStyle = '#3A9E94';
                        ctxAlt.fillRect(0, 0, canvasAlt.width, 55);
                        ctxAlt.fillStyle = 'white';
                        ctxAlt.font = 'bold 28px "Poppins", sans-serif';
                        ctxAlt.fillText('ticketone', 28, 45);
                        ctxAlt.font = 'bold 18px "Poppins"';
                        ctxAlt.fillStyle = '#2B6B61';
                        ctxAlt.fillText('DATI ORDINE', 28, 105);
                        ctxAlt.font = '600 16px "Poppins"';
                        ctxAlt.fillStyle = '#1A4F47';
                        ctxAlt.fillText('Mariel Abrigo', 28, 140);
                        ctxAlt.fillText('Gutierrez Joana Marie', 28, 170);
                        ctxAlt.fillText('Ippodromo del Visarno · Firenze', 28, 215);
                        ctxAlt.font = 'bold 19px "Poppins"';
                        ctxAlt.fillStyle = '#D45A2B';
                        ctxAlt.fillText('4 Luglio 2026 Ore 21:00', 28, 265);
                        ctxAlt.fillStyle = '#2C7A6E';
                        ctxAlt.fillText('PIT - ROSA · TITOLO DIGITALE', 28, 310);
                        ctxAlt.fillStyle = '#5A706A';
                        ctxAlt.font = '13px sans-serif';
                        ctxAlt.fillText('Gemitaiz · Concerto', 28, 355);
                        for (let i = 0; i < 32; i++) {
                            ctxAlt.fillStyle = '#3A9E94';
                            ctxAlt.fillRect(55 + i * 12, 390, 7, 34);
                        }
                        ctxAlt.fillStyle = '#3A9E94';
                        ctxAlt.font = 'bold 14px monospace';
                        ctxAlt.fillText('BUON DIVERTIMENTO!', canvasAlt.width - 190, 480);
                        const dataUrl = canvasAlt.toDataURL('image/png');
                        imgElem.src = dataUrl;
                    };
                    if (imgElem.complete && imgElem.naturalWidth === 0) imgElem.onerror();
                }
            }
            
            function hideTicket() {
                ticketWrapper.classList.remove('active');
                if (globalOverlay.classList.contains('active')) globalOverlay.classList.remove('active');
            }
            
            // Eventi
            if (scopriBtn) {
                scopriBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const rect = scopriBtn.getBoundingClientRect();
                    createSparklesBurst(rect.left + rect.width/2, rect.top + rect.height/2);
                    showStepOne();
                });
            }
            
            if (proseguiBtn) {
                proseguiBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const rect = proseguiBtn.getBoundingClientRect();
                    createSparklesBurst(rect.left + rect.width/2, rect.top + rect.height/2);
                    showTicket();
                });
            }
            
            if (closeStepOneBtn) closeStepOneBtn.addEventListener('click', () => hideStepOne());
            if (floatingTicket) floatingTicket.addEventListener('click', (e) => { e.stopPropagation(); hideTicket(); });
            if (globalOverlay) globalOverlay.addEventListener('click', () => {
                if (stepOneCard.classList.contains('active')) hideStepOne();
                else if (ticketWrapper.classList.contains('active')) hideTicket();
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (stepOneCard.classList.contains('active')) hideStepOne();
                    if (ticketWrapper.classList.contains('active')) hideTicket();
                }
            });
        })();
    </script>
</body>
</html>
